[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "library-ingestor"
version = "0.1.0"
description = "Private, local digital-library ingestion into Qdrant"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "docling>=2.129,<3",
  "sentence-transformers>=6.1,<7",
  "qdrant-client>=1.19,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "pypdf>=6,<7",
  "defusedxml>=0.7,<1",
  "filelock>=3.19,<4",
  "onnxruntime>=1.23,<2",
  "fastapi>=0.135,<1",
  "uvicorn>=0.40,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
library-ingestor = "library_ingestor.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.17,<2", "types-PyYAML>=6", "reportlab>=4,<5"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a running local Qdrant", "models: requires downloaded local models"]
addopts = "-m 'not integration and not models'"
